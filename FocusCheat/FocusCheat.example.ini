; FocusCheat optional custom hooks.
; Copy this file to FocusCheat.ini (same folder as FocusCheat.dll) and
; fill in values for YOUR OWN application that you own or are authorized
; to test. Leave the file absent to disable custom hooks entirely.
;
; Module    - DLL loaded in the target process to scan.
; Signature1/Signature2 - marker strings whose referencing functions
;   will be located at runtime and neutralized (no-op hook).
;
; Notes: if Module is not loaded yet at inject time, a watcher thread
;   retries for ~60s. Diagnostics go to FocusCheat.log next to the DLL.

[CustomHooks]
Module=example_module.dll
Signature1=ExampleEventA
Signature2=ExampleEventB
